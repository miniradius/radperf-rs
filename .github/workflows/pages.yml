name: Project website

on:
  push:
    paths:
      - site/**
      - radperf.1
      - scripts/render_web_manual.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Render the manual
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mandoc
          sh scripts/render_web_manual.sh > site/manual.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: site
      # Artifact discovery can lag behind upload finalization (actions/deploy-pages#451).
      - name: Wait for the Pages artifact to become visible
        run: sleep 120
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
