name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: radperf-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: radperf-linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: radperf-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - name: Test, build, and smoke-test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --locked --release --bin radperf --target "$TARGET"
          mkdir -p release-assets
          install -m 0755 "target/$TARGET/release/radperf" "release-assets/$ASSET"
          "release-assets/$ASSET" --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  upload:
    name: Attach binaries to the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: radperf-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums and upload release assets
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          files=(radperf-linux-amd64 radperf-linux-arm64 radperf-darwin-arm64)
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum "${files[@]}" > SHA256SUMS
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${files[@]}" SHA256SUMS
